<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>cp2cl 状态</title>
<link rel="stylesheet" href="/vendor/weui.min.css">
<style>
  .page{padding:4px 0 calc(28px + env(safe-area-inset-bottom))}
  .weui-cells__title{margin-top:22px}
  .weui-cells__title:first-child{margin-top:14px}
  .weui-cell{padding-top:11px;padding-bottom:11px}
  .weui-cell__bd{flex:0 0 auto;padding-right:16px}
  .weui-cell__ft{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:14px}
  .weui-cell__ft.none{opacity:.35}
  .weui-cell_block{display:block}
  .weui-cell_block .weui-cell__bd{padding-right:0}
  .weui-cell_block .weui-cell__ft{text-align:left;margin-top:6px;font-size:13px;opacity:.75}
  .line{padding:2px 0}
  .v-ok{color:#07c160}
  .v-warn{color:#fa9d3b}
  .v-bad{color:#fa5151}
  .stamp{text-align:center;font-size:12px;opacity:.45;padding:18px 16px 0;margin:0}
</style>
</head>
<body>
<div class="page">
  <div class="weui-cells__title">CarLife 连接 · 车机端</div>
  <div class="weui-cells" id="carlife"></div>
  <div class="weui-cells__title">CarPlay 连接 · 手机端</div>
  <div class="weui-cells" id="carplay"></div>
  <p class="stamp" id="stamp">正在读取…</p>
</div>
<script>
"use strict";

const NONE = "—";

function bool(v, on, off) {
  return v === null || v === undefined ? null : (v ? on : off);
}
function num(v) {
  return v === null || v === undefined ? null : Number(v).toLocaleString("zh-CN");
}
function size(s) {
  return s ? s.width + " × " + s.height + " · " + s.fps + " fps" : null;
}
function pair(a, b) {
  return a === null || a === undefined ? null : (b === null || b === undefined ? String(a) : a + " / " + b);
}

/* 一行：标签、取值、状态（ok / warn / bad，决定右侧颜色）。 */
const CARLIFE_ROWS = [
  ["USB 枚举状态", d => bool(d.usb.enumerated, "已枚举", "未枚举"),
    d => d.usb.enumerated === true ? "ok" : d.usb.enumerated === false ? "warn" : null],
  ["设备形态", d => bool(d.accessory, "配件形态", "手机形态")],
  ["USB 厂商 / 产品", d => pair(d.usb.manufacturer, d.usb.product)],
  ["USB 序列号", d => d.usb.serial],
  ["USB 标识", d => d.usb.vid === null || d.usb.vid === undefined
    ? null : d.usb.vid.toString(16).padStart(4, "0") + ":" + d.usb.pid.toString(16).padStart(4, "0")],
  ["USB 控制器", d => d.usb.controller],
  ["AOA 协议版本", d => d.aoa_version],
  ["车机厂商标识", d => d.asked[0]],
  ["车机型号标识", d => d.asked[1]],
  ["车机描述标识", d => d.asked[2]],
  ["车机版本标识", d => d.asked[3]],
  ["车机 URI 标识", d => d.asked[4]],
  ["车机序列号标识", d => d.asked[5]],
  ["CarLife 协议版本", d => d.protocol ? d.protocol.major + "." + d.protocol.minor : null],
  ["会话状态", d => bool(d.session_up, "已建立", "未建立"), d => d.session_up ? "ok" : null],
  ["车机 cuid", d => d.statistic && d.statistic.cuid],
  ["车机应用版本", d => d.statistic && d.statistic.version_name],
  ["车机版本号", d => d.statistic && num(d.statistic.version_code)],
  ["渠道号", d => d.statistic && d.statistic.channel],
  ["渠道号判定", d => bool(d.channel_legal, "合法", "不合法"),
    d => d.channel_legal === true ? "ok" : d.channel_legal === false ? "bad" : null],
  ["累计连接次数", d => d.statistic && num(d.statistic.connect_count)],
  ["累计连接成功次数", d => d.statistic && num(d.statistic.connect_success_count)],
  ["连接耗时", d => d.statistic && d.statistic.connect_time],
  ["认证挑战值", d => d.challenge],
  ["挑战应答状态", d => bool(d.challenge_answered, "已应答", "未应答"),
    d => d.challenge_answered === true ? "ok" : d.challenge_answered === false ? "bad" : null],
  ["车机认证结果", d => bool(d.accepted, "已接受", "未接受"),
    d => d.accepted === true ? "ok" : d.accepted === false ? "bad" : null],
  ["车机请求分辨率", d => size(d.requested)],
  ["商定分辨率", d => size(d.agreed)],
  ["视频编码器状态", d => bool(d.encoding, "运行中", "已停止"),
    d => d.encoding ? "ok" : null],
  ["帧率协商", d => d.frame_rate === null || d.frame_rate === undefined ? null : d.frame_rate + " fps"],
  ["音频通道格式", d => d.media
    ? d.media.rate + " Hz · " + d.media.channels + " 声道 · " + d.media.bits + " bit" : null],
  ["车机错误报文", d => d.error_bytes === null || d.error_bytes === undefined
    ? null : d.error_bytes + " 字节"],
];

const CARLIFE_BLOCKS = [
  ["功能配置", d => d.features.length
    ? d.features.map(f => f.key + " = " + f.value) : null],
];

const CARPLAY_ROWS = [
  ["接入方式", d => bool(d.wireless, "蓝牙无线", "USB 有线")],
  ["设备序列号", d => d.phone],
  ["配件名称", d => d.name],
  ["蓝牙地址", d => d.bt_mac],
  ["设备识别", d => bool(d.identified, "已识别", "未识别"), d => d.identified ? "ok" : null],
  ["MFi 认证", d => bool(d.authenticated, "已通过", "未通过"),
    d => d.authenticated ? "ok" : null],
  ["订阅状态", d => bool(d.subscribed, "已发送", "未发送"), d => d.subscribed ? "ok" : null],
  ["会话失败原因", d => d.failed, () => "bad"],
  ["回连地址", d => d.advertised],
  ["AirPlay 监听端口", d => d.airplay_port],
  ["媒体接口", d => d.av_iface],
  ["无线网络", d => d.access_point && d.access_point.ssid],
  ["无线信道", d => d.access_point && d.access_point.channel],
  ["无线接口", d => d.access_point && d.access_point.iface],
  ["AirPlay 客户端", d => d.airplay.peer],
  ["配对校验", d => bool(d.airplay.verified, "已完成", "未完成"),
    d => d.airplay.verified ? "ok" : null],
  ["控制通道加密", d => bool(d.airplay.encrypted, "已加密", "未加密"),
    d => d.airplay.encrypted ? "ok" : null],
  ["事件通道端口", d => d.airplay.event_port],
  ["时间同步端口", d => d.airplay.timing_port],
  ["时钟偏差", d => d.airplay.clock_offset_us === null ? null : d.airplay.clock_offset_us + " µs"],
  ["时钟往返时延", d => d.airplay.clock_rtt_us === null ? null : d.airplay.clock_rtt_us + " µs"],
  ["渲染分辨率", d => d.screen ? size(d.screen) : null],
  ["渲染画布", d => d.screen ? d.screen.canvas_width + " × " + d.screen.canvas_height : null],
  ["屏幕密度", d => d.screen ? d.screen.ppi + " ppi" : null],
  ["物理尺寸", d => d.screen ? d.screen.width_mm + " × " + d.screen.height_mm + " mm" : null],
  ["视频编码格式", () => "H.264"],
  ["视频流状态", d => bool(d.video.active, "已连接", "未连接"), d => d.video.active ? "ok" : null],
  ["视频消息数", d => num(d.video.messages)],
  ["视频帧数", d => num(d.video.frames)],
];

const CARPLAY_BLOCKS = [
  ["音频流", d => d.audio.length ? d.audio.map(a =>
    a.stream_type + " · " + (a.name || NONE) + " · " + a.codec + " " +
    (a.rate / 1000) + " kHz " + a.channels + " 声道 · " +
    a.frames_per_packet + " 帧/包 · 抖动 " + a.latency_ms + " ms") : null],
  ["音频质量", d => d.audio.length ? d.audio.map(a =>
    a.stream_type + "：收 " + num(a.packets) + " 包，丢 " + num(a.missing) +
    "，乱序 " + num(a.out_of_order) + "，重复 " + num(a.duplicates) +
    "，最大间隔 " + a.worst_gap_ms + " ms") : null],
  ["麦克风上行", d => d.mic
    ? [d.mic.peer + " · " + d.mic.codec + " " + (d.mic.rate / 1000) + " kHz " + d.mic.channels + " 声道"]
    : null],
];

/* 一个单元格：标签在左，取值在右；取值多行时改为上下排布。 */
function cell(label, value, tone, block) {
  const row = document.createElement("div");
  row.className = block ? "weui-cell weui-cell_block" : "weui-cell";

  const bd = document.createElement("div");
  bd.className = "weui-cell__bd";
  const name = document.createElement("p");
  name.textContent = label;
  bd.appendChild(name);

  const ft = document.createElement("div");
  ft.className = "weui-cell__ft";
  if (tone) ft.classList.add("v-" + tone);
  if (value === null || value === "") {
    ft.textContent = NONE;
    ft.classList.add("none");
  } else if (block) {
    for (const line of value) {
      const p = document.createElement("div");
      p.className = "line";
      p.textContent = line;
      ft.appendChild(p);
    }
  } else {
    ft.textContent = value;
  }

  row.appendChild(bd);
  row.appendChild(ft);
  return row;
}

function fill(host, rows, blocks, data) {
  host.textContent = "";
  for (const [label, value, tone] of rows) {
    host.appendChild(cell(label, value(data), tone ? tone(data) : null, false));
  }
  for (const [label, lines] of blocks) {
    const value = lines(data);
    // 一项都没有的空块不是「未知」，而是「没有」：两者都不显示更干净。
    if (value && value.length) host.appendChild(cell(label, value, null, true));
  }
}

function render(data) {
  fill(document.getElementById("carlife"), CARLIFE_ROWS, CARLIFE_BLOCKS, data.carlife);
  fill(document.getElementById("carplay"), CARPLAY_ROWS, CARPLAY_BLOCKS, data.carplay);
}

const stamp = document.getElementById("stamp");

async function tick() {
  try {
    const response = await fetch("/api/status", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    render(await response.json());
    stamp.className = "stamp";
    stamp.textContent = "最后更新 " +
      new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) {
    // 读不到就是读不到：说清楚比留一个空页面有用。
    stamp.className = "stamp v-bad";
    stamp.textContent = "读取失败：" + e.message;
  }
}

/* 页面在后台时不必轮询：这块板子还要跑桥接。 */
function schedule() {
  if (document.hidden) return;
  tick();
}

tick();
setInterval(schedule, 2000);
document.addEventListener("visibilitychange", schedule);
</script>
</body>
</html>
