[package]
name = "cp2cl"
version = "0.6.1"
edition = "2021"
description = "Headless CarPlay receiver that hands an iPhone's streams to a CarLife head unit"
license = "GPL-3.0-or-later"

# The LIVI crates come from the `vendor/LIVI` submodule, pinned to the
# `feature/local-credential` branch. LIVI's repository root is an Electron app
# with no top-level Cargo.toml; its Rust lives under `native/`, so every path
# spells that out. See README "Depending on LIVI".

[dependencies]
livi-runtime = { path = "vendor/LIVI/native/livi-helperd/crates/livi-runtime" }
iap2-link = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-link" }
iap2-wired = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-wired" }
# Linux has no usbmuxd to ask — Alpine does not even package one — so the phone's
# CarPlay USB configuration and its mux are claimed in-process instead. See
# `src/session.rs`.
iap2-usbmux = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-usbmux" }
iap2-mfi = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-mfi" }
iap2-csm = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-csm" }
# Needed directly to name `idevice::ReadWrite` in our own function signatures.
# Same version LIVI resolves, so it unifies into one build.
idevice = "0.1"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# The car's media channel takes PCM and a phone on wireless CarPlay sends its
# music as AAC-LC, so the codec has to come off on the way past. Only the
# decoder is wanted — no demuxers, no other codecs — which is what the empty
# default feature set leaves out. See PLAN-CL.md §4.2.
symphonia = { version = "0.5", default-features = false, features = ["aac"] }

# The car's authentication challenge is answered with the phone's own RSA key, so
# the primitive has to come from somewhere: it is not written here. Pure Rust
# like the rest, so the board needs nothing new on its toolchain either. See
# src/carlife/auth.rs.
rsa = "0.9"

# CarPlay airplay net audio/video is sealed with ChaCha20-Poly1305 and its keys
# come from an X25519 + Ed25519 handshake (see src/airplay/pairing.rs).
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# pair-setup is SRP-6a over the RFC 5054 3072-bit group with SHA-512.
num-bigint = "0.4"
num-traits = "0.2"

# /auth-setup (MFiSAP) returns the coprocessor signature sealed with AES-128-CTR,
# and 2.0-class accessories digest the two public keys with SHA-1.
aes = "0.8"
ctr = "0.9"
sha1 = "0.10"

# GET /info has to be answered with a binary property list, and events are
# bplist too.
plist = "1"
base64 = "0.22"
hex = "0.4"

thiserror = "1"
anyhow = "1"
# Mounting and unmounting the FunctionFS instance the CarLife interface runs on.
# Both are one syscall each, and the program has to do them itself: the instance
# is composed, and taken down, by this process. See src/carlife/usb.rs.
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Read back so a paired phone is not asked to pair again.
serde_json = "1"

