[package]
name = "cp2cl"
version = "0.12.0"
edition = "2021"
description = "Headless CarPlay receiver that hands an iPhone's streams to a CarLife head unit"
license = "GPL-3.0-or-later"

# The LIVI crates come from the `vendor/LIVI` submodule, pinned to the
# `feature/cp2cl-10.1` branch. LIVI's repository root is an app; its Rust lives
# under `native/`, and every crate sits flat under `native/crates`. See README
# "Depending on LIVI".

[dependencies]
livi-runtime = { path = "vendor/LIVI/native/crates/livi-runtime" }
iap2-link = { path = "vendor/LIVI/native/crates/iap2-link" }
iap2-wired = { path = "vendor/LIVI/native/crates/iap2-wired" }
# Linux has no usbmuxd to ask — Alpine does not even package one — so the phone's
# CarPlay USB configuration and its mux are claimed in-process instead. See
# `src/session.rs`.
iap2-usbmux = { path = "vendor/LIVI/native/crates/iap2-usbmux" }
# `files` is what signs a challenge with an identity kept on disk: there is no
# MFi coprocessor on this board. See `main::mfi_signer`.
iap2-mfi = { path = "vendor/LIVI/native/crates/iap2-mfi", features = ["files"] }
iap2-csm = { path = "vendor/LIVI/native/crates/iap2-csm" }
# `CpConfig::channel` is a `livi_wifi::Channel`, and LIVI does not re-export it.
livi-wifi = { path = "vendor/LIVI/native/crates/livi-wifi" }
# Paging a paired phone is one BlueZ D-Bus call, and LIVI's own paging loop is
# tied to the state its app keeps. Same version LIVI resolves, so it unifies
# into one build. See `src/wireless/page.rs`.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Needed directly to name `idevice::ReadWrite` in our own function signatures.
# Same version LIVI resolves, so it unifies into one build.
idevice = "0.1"
# The car stamps its own reports, and turning a stamp into a date is a calendar
# rather than a clock: leap years and month lengths are the library's problem.
# `idevice` already builds chrono with all of its defaults, so naming it costs
# the binary nothing; only `std` is asked for here and the rest of the set comes
# in through that same unification. See `carlife::session`.
chrono = { version = "0.4", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# The car's media channel takes PCM and a phone on wireless CarPlay sends its
# music as AAC-LC, so the codec has to come off on the way past. Only the
# decoder is wanted — no demuxers, no other codecs — which is what the empty
# default feature set leaves out.
symphonia = { version = "0.5", default-features = false, features = ["aac"] }

# The navigation prompt is the one stream that is neither forwarded nor left
# alone: it arrives as Opus and the car's TTS channel takes 16 kHz PCM, so it is
# decoded and decimated on the way past. Pure Rust, like symphonia, so the
# cross build needs nothing added to its image. See src/airplay/audio.rs.
rusty-opus = "1"

# The car's authentication challenge is answered with the phone's own RSA key, so
# the primitive has to come from somewhere: it is not written here. Pure Rust
# like the rest, so the board needs nothing new on its toolchain either. See
# src/carlife/auth.rs.
rsa = "0.9"

# A cover that will not fit the car's media message is re-encoded before it is
# sent, and the phone's artwork arrives as JPEG or PNG. Decode with the two zune
# readers (they share zune-core), encode with jpeg-encoder, which writes baseline
# 4:2:0 and no metadata. All pure Rust: the board's toolchain needs nothing new.
# See src/artwork.rs.
zune-jpeg = "0.5"
zune-png = "0.5"
# Both readers take their options from this crate and give back its colour
# spaces, so it is named here rather than reached for through either of them.
zune-core = "0.5"
jpeg-encoder = "0.7"
# One tag out of the phone's EXIF decides which way up the picture goes, and it
# has to be applied before the metadata is dropped.
kamadak-exif = "0.6"

# CarPlay airplay net audio/video is sealed with ChaCha20-Poly1305 and its keys
# come from an X25519 + Ed25519 handshake (see src/airplay/pairing.rs).
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# pair-setup is SRP-6a over the RFC 5054 3072-bit group with SHA-512.
num-bigint = "0.4"
num-traits = "0.2"

# /auth-setup (MFiSAP) returns the coprocessor signature sealed with AES-128-CTR,
# and 2.0-class accessories digest the two public keys with SHA-1.
aes = "0.8"
ctr = "0.9"
sha1 = "0.10"

# GET /info has to be answered with a binary property list, and events are
# bplist too. The same `base64` carries the NMEA block a position reaches the
# phone as — see `src/carlife/gps.rs`.
plist = "1"
base64 = "0.22"
hex = "0.4"

thiserror = "1"
anyhow = "1"
# Mounting and unmounting the FunctionFS instance the CarLife interface runs on.
# Both are one syscall each, and the program has to do them itself: the instance
# is composed, and taken down, by this process. See src/carlife/usb.rs.
libc = "0.2"
tracing = "0.1"
# No `env-filter`: the only control is a single level, and the directive syntax
# that feature brings is a regex engine — a quarter of a megabyte of it, built
# into the binary to parse one word. See `config::log_filter`.
tracing-subscriber = "0.3"
# Read back so a paired phone is not asked to pair again.
serde_json = "1"

# The status page's router and listener. The only features asked for are the two
# that serve it: what used the rest of axum was a WebSocket, and that went with
# the browser client it was written for. See `src/web/mod.rs`.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# The binary is copied to the board over the access point that board itself
# serves, so its size is a deployment cost. What is here is worth half of it:
# 14.4 MB unstripped became 6.8 MB.
#
# `strip` alone is a third of that: the symbol table is 4.2 MB of the 14.4, and
# nothing reads it on the board.
#
# `lto` and one codegen unit are the same decision. 213 crates each
# monomorphising the same generics is where most of the text came from, and
# neither costs anything at run time.
#
# `panic = "abort"` drops the unwind tables — 0.5 MB of `.ARM.extab` and
# `.ARM.exidx` — and takes a panic in any task with it: the process ends, and
# whatever started it starts it again. Nothing here catches a panic, so nothing
# is lost but the unwinding.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
