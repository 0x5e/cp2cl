[package]
name = "cp2cl"
version = "0.6.1"
edition = "2021"
description = "Headless CarPlay receiver that serves an iPhone's streams to a browser client"
license = "GPL-3.0-or-later"

# The LIVI crates come from the `vendor/LIVI` submodule, pinned to the
# `feature/local-credential` branch. LIVI's repository root is an Electron app
# with no top-level Cargo.toml; its Rust lives under `native/`, so every path
# spells that out. See README "Depending on LIVI".

[dependencies]
livi-runtime = { path = "vendor/LIVI/native/livi-helperd/crates/livi-runtime" }
iap2-link = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-link" }
iap2-wired = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-wired" }
# Linux has no usbmuxd to ask — Alpine does not even package one — so the phone's
# CarPlay USB configuration and its mux are claimed in-process instead. See
# `src/session.rs`.
iap2-usbmux = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-usbmux" }
iap2-mfi = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-mfi" }
iap2-csm = { path = "vendor/LIVI/native/livi-helperd/crates/iap2-csm" }
# Needed directly to name `usbmuxd::UsbmuxdDevice` in our own function
# signatures. Same version LIVI resolves, so these unify into one build.
idevice = { version = "0.1", features = ["usbmuxd"] }

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# CarPlay airplay net audio/video is sealed with ChaCha20-Poly1305 and its keys
# come from an X25519 + Ed25519 handshake (see src/airplay/pairing.rs).
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# pair-setup is SRP-6a over the RFC 5054 3072-bit group with SHA-512.
num-bigint = "0.4"
num-traits = "0.2"

# /auth-setup (MFiSAP) returns the coprocessor signature sealed with AES-128-CTR,
# and 2.0-class accessories digest the two public keys with SHA-1.
aes = "0.8"
ctr = "0.9"
sha1 = "0.10"

# GET /info has to be answered with a binary property list, and events are
# bplist too.
plist = "1"
base64 = "0.22"
hex = "0.4"

thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The debug UI is PlayPort's own browser client, served out of the submodule.
# Its Kotlin server is replaced by these: an HTTPS host (WebCodecs refuses to
# decode outside a secure context, so plain HTTP only works on localhost) with
# a WebSocket carrying the same JSON control messages and binary media wire.
#
# `tls-rustls-no-provider` rather than `tls-rustls`: the latter would pull in
# `aws-lc-rs` as the crypto provider, and rustls then refuses to guess which one
# the process wants — the same refusal that keeps `aws-lc-sys` out of the
# cross-compiled build. Naming no provider means the process has to install one
# itself, which `main` does; `ring` is the one, and it is named here so the
# binary can install it.
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Enumerating the interfaces, to print every address the page can be opened at.
if-addrs = "0.15"
