image boot.vfat {
	vfat {
		files = {
			"zImage",
			"sun8i-h3-nanopi-duo2.dtb",
			"boot.scr"
		}
	}
	size = 8M
}

# The SPL goes at 8 KiB with no partition table entry, which is where the H3
# BootROM looks. Everything after it is ordinary partitions.
image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		image = "boot.vfat"
		size = 8M
	}

	# 24M holds a ~7M squashfs with room to grow; the card is not the cost.
	partition rootfs {
		image = "rootfs.squashfs"
		size = 24M
	}
}
