image boot.vfat {
	vfat {
		files = {
			"zImage",
			"sun8i-h3-nanopi-duo2.dtb",
			"boot.scr"
		}
	}
	# 8M for 7.0M of contents: the LZ4 kernel, the device tree and the boot
	# script. 7M was enough until the radio came in — cfg80211, mac80211 and
	# brcmfmac are 670 KB of the LZ4 image, and genimage's only way of saying so
	# is "Disk full" while it writes the FAT.
	size = 8M
}

# The SPL goes at 8 KiB with no partition table entry, which is where the H3
# BootROM looks. Everything after it is ordinary partitions.
#
# The types and the boot flag are written out because genimage defaults both to
# zero, and a table of type-0 entries with nothing marked bootable is one that
# `part list -bootable` reports as empty. U-Boot falls back to partition 1 when
# that happens, so it boots either way — but only by accident, and only for as
# long as that fallback is in the boot script.
image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		image = "boot.vfat"
		size = 8M
		partition-type = 0x0c
		bootable = true
	}

	# No size: genimage makes the partition exactly as long as the squashfs.
	# Giving it a fixed one leaves the last partitions of the image file beyond
	# the end of what genimage actually writes, and the table then promises
	# space the file does not have.
	partition rootfs {
		image = "rootfs.squashfs"
		partition-type = 0x83
	}
}
