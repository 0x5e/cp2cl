# Dedicated access point for the cp2cl CarPlay receiver.
# The onboard radio is an AP6212 / BCM43438: 2.4 GHz, 1x1, so hw_mode=g only.
# 802.11n is ieee80211n, not a hw_mode value: hostapd takes a/b/g/ad/ah there,
# and `hw_mode=n` stops it from starting.
interface=wlan0
driver=nl80211
# What hostapd_cli talks to. Nothing else on the board uses it; it is here so
# that the running configuration and the stations can be asked for by name.
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
# The first boot replaces this with the hostname, which carries the last four
# characters of wlan0's address (`S12name`); what is here is what a board whose
# radio never appeared goes on air with.
ssid=CarPlayBox
country_code=CN
hw_mode=g
# One of the three that do not overlap. 6 is where consumer routers and phone
# hotspots default to and 1 is the runner-up, so 11 is the quietest of the set in
# a city — and the car moves, so the set is all that can be chosen from. Off the
# grid (2-5, 7-10) overlaps two neighbours at once, which corrupts frames instead
# of queueing them; 12 and 13 overlap 11 and can be refused by a client whose
# regulatory domain stops there.
channel=11
ieee80211n=1
# Short guard interval at 20 MHz is the one 802.11n capability this radio has
# that costs nothing: the same symbols carry ~11% more. 40 MHz is left off on
# purpose — it is twice the airtime to lose to the Bluetooth half of the chip.
ht_capab=[SHORT-GI-20]
wmm_enabled=1
# A phone in power save wakes for the beacon a DTIM marks and no other. At the
# default of 2 that is every 200 ms, which the phone pays for in latency.
dtim_period=1
# The default here is 1, which drops a station over unacknowledged frames. On a
# link that shares its antenna with Bluetooth, that is a disassociation caused by
# interference rather than by the phone leaving.
disassoc_low_ack=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=88888888
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
# The default of 600 rotates the group key every ten minutes, and each rotation
# is a handshake that can fail. There is one client here and it is a metre away;
# the rotation buys nothing that is worth a periodic way to lose the link.
wpa_group_rekey=0
