image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"Image.gz",
			"sun50i-h618-orangepi-zero2w.dtb",
			"boot.scr"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		image = "boot.vfat"
		size = 32M
		partition-type = 0x0c
		bootable = true
	}

	partition rootfs {
		image = "rootfs.ext4"
		partition-type = 0x83
	}
}
