image boot.vfat {
	vfat {
		# Without this the FAT volume carries the label mkfs writes by
		# default, `NO NAME`, and that is the name a desktop puts on the
		# card when it mounts it. Nothing on the board reads it: U-Boot
		# loads from `mmc 0:1` by number, and /etc/fstab does not mount
		# this partition at all.
		label = "BOOT"
		files = {
			"Image.gz",
			"sun50i-h618-orangepi-zero2w.dtb",
			"boot.scr"
		}
	}
	# 32M for 13.5M of contents: the gzipped kernel, the device tree and the
	# boot script. Four times the NanoPi's, because an arm64 kernel is not
	# three times the LZ4 armv7 one but ten: the generic defconfig keeps far
	# more built in than sunxi's. 16M would hold it with 3M spare, which is one
	# kernel bump away from not holding it, and the partition is written whole,
	# so the slack costs nothing on a card measured in GB.
	size = 32M
}

# The SPL goes at 8 KiB with no partition table entry, which is where the H618
# BootROM looks. Everything after it is ordinary partitions.
#
# The types and the boot flag are written out because genimage defaults both to
# zero, and a table of type-0 entries with nothing marked bootable is one that
# `part list -bootable` reports as empty. U-Boot falls back to partition 1 when
# that happens, so it boots either way — but only by accident, and only for as
# long as that fallback is in the boot script.
image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		image = "boot.vfat"
		size = 32M
		partition-type = 0x0c
		bootable = true
	}

	# No size: the image is already exactly as long as the filesystem, and
	# genimage makes the partition that long. Giving it a fixed one here and
	# there leaves the file and the table disagreeing about where the card
	# ends.
	partition rootfs {
		image = "rootfs.ext4"
		partition-type = 0x83
	}
}
