# Dedicated access point for the cp2cl CarPlay receiver.
# The radio is a UWE5622 (20U5622 module): 802.11a/b/g/n/ac, 1x1, and this file
# asks for the 5 GHz band — hw_mode=a, not g.
interface=wlan0
driver=nl80211
# What hostapd_cli talks to. Nothing else on the board uses it; it is here so
# that the running configuration and the stations can be asked for by name.
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
# The first boot replaces this with the hostname, which carries the last four
# characters of wlan0's address (`S12firstboot`); what is here is what a board
# whose radio never appeared goes on air with.
ssid=CarPlayBox
country_code=CN
hw_mode=a
# 149: the 5.8 GHz band, non-DFS, and the channels Chinese consumer routers
# leave alone most often — 36 and 44 are where almost every access point in a
# city sits. A car moves, so what is crowded changes; 149 is the least bad of a
# band that has thirteen usable channels instead of three.
#
# Not 52-64: those are DFS, and a radar event takes the access point off the air
# for a minute while it rescans. Not 165: 20 MHz only, no neighbour to pair with.
channel=149
# Announcing the country is what lets hostapd set the regulatory domain before
# it checks the channel, rather than being refused by the world domain's rules.
ieee80211d=1
ieee80211n=1
# 40 MHz and short guard interval. 802.11ac is left off deliberately: CarPlay is
# 20-30 Mbps of video and audio, and VHT80 would add driver paths that nothing
# here needs and that this out-of-tree driver has the least testing behind.
ht_capab=[HT40+][SHORT-GI-40]
wmm_enabled=1
# A phone in power save wakes for the beacon a DTIM marks and no other. At the
# default of 2 that is every 200 ms, which the phone pays for in latency.
dtim_period=1
# The default here is 1, which drops a station over unacknowledged frames. On a
# link that shares its antenna with Bluetooth, that is a disassociation caused by
# interference rather than by the phone leaving.
disassoc_low_ack=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=88888888
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
# The default of 600 rotates the group key every ten minutes, and each rotation
# is a handshake that can fail. There is one client here and it is a metre away;
# the rotation buys nothing that is worth a periodic way to lose the link.
wpa_group_rekey=0
