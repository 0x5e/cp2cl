[package]
name = "carlife-md"
version = "0.14.0"
edition = "2021"
description = "The CarLife mobile-device end of cp2cl: an accessory a head unit can plug into"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# `Vehicle` is where the car's position goes, and it is the same object the
# CarPlay half hands to the phone.
livi-runtime = { path = "../../vendor/LIVI/native/crates/livi-runtime" }
tokio = { version = "1", features = ["fs", "net", "io-util", "sync", "time", "macros", "rt"] }
futures-util = "0.3"
anyhow = "1"
# The car's challenge is answered with the phone's own RSA key.
rsa = "0.9"
base64 = "0.22"
# The car stamps its own reports, and a stamp is turned into a date.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Mounting the FunctionFS instance is one syscall each.
libc = "0.2"
tracing = "0.1"
serde_json = "1"

[dev-dependencies]
rand = "0.8"
