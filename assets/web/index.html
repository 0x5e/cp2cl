<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>cp2cl</title>
<link rel="stylesheet" href="/vendor/weui.min.css">
<style>
  html,body{height:100%;overflow:hidden;overscroll-behavior-x:none}
  /* The document itself never scrolls: one part of the page scrolls, and the
     log tab is a box of its own that scrolls inside that. Two scrollbars on one
     screen are two places to drag, and only one of them is the log. */
  .page{box-sizing:border-box;height:100%;overflow-y:auto;
    padding:4px 0 calc(76px + env(safe-area-inset-bottom))}
  .weui-cells__title{margin-top:22px}
  .weui-cells__title:first-child{margin-top:14px}
  .panel{display:none}
  .panel.on{display:block}
  /* The log fills what is left of the tab and scrolls in its own box, so the
     part that scrolls is the lines and not the page around them. */
  #panel-log.on{display:flex;flex-direction:column;height:100%}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;
    background:var(--weui-BG-2);border-top:1px solid var(--weui-FG-3);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .tab{flex:1;padding:12px 0 10px;font:inherit;font-size:15px;
    color:var(--weui-FG-1);background:none;border:0;-webkit-tap-highlight-color:transparent}
  .tabbar .tab.on{color:var(--weui-BRAND-100)}
  .log{flex:1 1 auto;min-height:0;overflow-y:auto;margin:0;padding:10px 16px;
    font:10px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap;word-break:break-all;color:var(--weui-FG-0);tab-size:4}
  .log [hidden]{display:none}
  /* The level is what a log is read for, so what is below the one being looked
     for is dropped rather than scrolled past. */
  /* A label and the value it names are one thing, so they sit together: a
     label at one edge of the bar and its value at the other reads as two. */
  .log-bar{display:flex;align-items:center;gap:16px;padding:8px 16px;
    border-bottom:1px solid var(--weui-FG-3);background:var(--weui-BG-2);
    font-size:13px;color:var(--weui-FG-1);white-space:nowrap}
  .log-pick{display:flex;align-items:center;gap:6px;min-width:0}
  .log-bar select{font:inherit;color:var(--weui-FG-0);
    background:none;border:0;padding:2px 0;min-width:0}
  .log-fold{display:flex;align-items:center;gap:4px}
  .log-fold input{accent-color:var(--weui-BRAND);margin:0}
  /* Taking the copy away is the one control here that is not about looking at
     it, so it is at the other end of the bar from the two that are. */
  .log-grab{margin-left:auto;color:var(--weui-BRAND-100);text-decoration:none}
  /* Not wrapping gives a line back its shape, which is what a line is read by:
     the whole of it goes on one row and the box scrolls sideways for the rest. */
  .log.nowrap{white-space:pre;word-break:normal;overflow-x:auto}
  /* The same reads as the terminal's: the stamp is greyed because it is looked
     up rather than read, and a level says how loud it is by its colour. */
  .log .tm{color:var(--weui-FG-2)}
  .log .lv.error{color:var(--weui-RED)}
  .log .lv.warn{color:var(--weui-ORANGE)}
  .log .lv.info{color:var(--weui-BRAND)}
  .log .lv.debug{color:var(--weui-BLUE)}
  .weui-cell{padding-top:11px;padding-bottom:11px}
  .weui-cell__bd{flex:0 0 auto;padding-right:16px}
  .weui-cell__ft{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:14px}
  .weui-cell__ft.none{opacity:.35}
  .weui-cell_block{align-items:flex-start}
  .line{padding:2px 0}
  .weui-cell_cover{align-items:flex-start}
  .cover{display:block;max-width:100%;max-height:200px;border-radius:6px;margin:2px 0 0 auto}
  .v-ok{color:#07c160}
  .v-warn{color:#fa9d3b}
  .v-bad{color:#fa5151}
  .stamp{text-align:center;font-size:12px;opacity:.45;padding:18px 16px 0;margin:0}
</style>
</head>
<body>
<div class="page">
  <div class="panel on" id="panel-status">
    <div class="weui-cells__title">CarLife 连接 · 车机端</div>
    <div class="weui-cells" id="carlife"></div>
    <div class="weui-cells__title">CarPlay 连接 · 手机端</div>
    <div class="weui-cells" id="carplay"></div>
    <div class="weui-cells__title" id="playing-title">正在播放</div>
    <div class="weui-cells" id="playing"></div>
    <div class="weui-cells__title" id="gps-title" style="display: none">车载数据 · GPS</div>
    <div class="weui-cells" id="gps" style="display: none"></div>
    <div class="weui-cells__title">设备端</div>
    <div class="weui-cells" id="device"></div>
    <p class="stamp" id="stamp">正在读取…</p>
  </div>
  <div class="panel" id="panel-log">
    <div class="log-bar">
      <span class="log-pick">
        <label for="log-level">级别</label>
        <select id="log-level">
          <option value="debug">DEBUG</option>
          <option value="info">INFO</option>
          <option value="warn">WARN</option>
          <option value="error">ERROR</option>
        </select>
      </span>
      <label class="log-fold" for="log-wrap">
        <input type="checkbox" id="log-wrap" checked>自动换行
      </label>
      <a class="log-grab" id="log-grab" href="/api/log/download"
         download title="下载完整日志">下载</a>
    </div>
    <pre class="log" id="log"></pre>
    <p class="stamp" id="log-stamp">正在读取…</p>
  </div>
  <div class="panel" id="panel-settings"></div>
</div>
<nav class="tabbar">
  <button class="tab on" id="tab-status" data-tab="status">状态</button>
  <button class="tab" id="tab-log" data-tab="log">日志</button>
  <button class="tab" id="tab-settings" data-tab="settings">设置</button>
</nav>
<script>
"use strict";

const NONE = "—";

function bool(v, on, off) {
  return v === null || v === undefined ? null : (v ? on : off);
}
function num(v) {
  return v === null || v === undefined ? null : Number(v).toLocaleString("zh-CN");
}
function size(s) {
  return s ? s.width + " × " + s.height + " @ " + s.fps + " fps" : null;
}
function pair(a, b) {
  return a === null || a === undefined ? null : (b === null || b === undefined ? String(a) : a + " / " + b);
}
function clock(seconds) {
  if (seconds === null || seconds === undefined) return null;
  const total = Math.max(0, Math.round(Number(seconds)));
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}
function percent(v) {
  return v === null || v === undefined ? null : v + "%";
}
function megabytes(bytes) {
  return Math.round(Number(bytes) / 1048576);
}
function memory(d) {
  if (!d.memory_total) return null;
  const used = megabytes(d.memory_used);
  const total = megabytes(d.memory_total);
  const share = Math.round(d.memory_used / d.memory_total * 100);
  return used + "MB / " + total + "MB (" + share + "%)";
}

function detail(...parts) {
  const shown = parts.filter(p => p !== null && p !== undefined && p !== "");
  return shown.length ? shown.join(" ") : null;
}
function video(v) {
  return detail(v.codec, v.profile, v.level && "L" + v.level);
}
function rate(hz) {
  return hz ? Math.round(hz / 10) / 100 + " kHz" : null;
}
function channels(n) {
  if (!n) return null;
  if (n === 1) return "Mono";
  if (n === 2) return "Stereo";
  return n + " ch";
}
function audioStream(a) {
  const body = detail(a.codec, rate(a.rate), channels(a.channels));
  return (a.name || a.stream_type) + ":" + (body ? " " + body : "");
}

// The car's own position. It arrives in the units the CarLife message is
// defined in: a millionth of a degree, a tenth of a metre, a hundredth of a
// kilometre an hour, a tenth of a degree.
const FIXED = d => !!d && d.antenna_state === 1;

function gpsState(d) {
  if (!d || d.antenna_state === undefined) return null;
  if (d.antenna_state === 1) return "已定位";
  if (d.antenna_state === -1) return "无定位";
  return String(d.antenna_state);
}
function degrees(millionths) {
  return (millionths / 1000000).toFixed(6) + "°";
}
function metres(v) {
  return v + " m";
}
// The car counts its fix in UTC; the page shows the clock the people in the car
// read, which is eight hours ahead of it.
function utc8(d) {
  if (!d || !d.year || !d.month || !d.day) return null;
  const pad = (n, width) => String(n).padStart(width, "0");
  const at = Date.UTC(d.year, d.month - 1, d.day, d.hour, d.minute, d.second) +
    8 * 3600 * 1000;
  const t = new Date(at);
  return t.getUTCFullYear() + "-" + pad(t.getUTCMonth() + 1, 2) + "-" +
    pad(t.getUTCDate(), 2) + " " + pad(t.getUTCHours(), 2) + ":" +
    pad(t.getUTCMinutes(), 2) + ":" + pad(t.getUTCSeconds(), 2);
}

// The channel table comes from the binary, the same file /info takes its labels
// from: one entry per make, holding the numbers it answers on and the code that
// names it. It is asked for once, when the page is opened — a table compiled
// into the binary does not change while the program runs.
const CHANNEL_MAP = {};

async function loadChannels() {
  try {
    const response = await fetch("/api/channels", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    for (const entry of await response.json()) {
      const code = entry.code || "UNKNOWN";
      for (const channel of entry.channels || []) {
        if (channel && channel.id) CHANNEL_MAP[String(channel.id).trim()] = code;
      }
    }
  } catch (e) {
    // No table is a page that shows the number alone, which is still the number.
  }
}

function channelLabel(raw) {
  if (!raw) return null;
  const id = raw.trim();
  return id + " (" + (CHANNEL_MAP[id] || "UNKNOWN") + ")";
}

const CARLIFE_UP = d => d.session_up === true;
const CARPLAY_UP = d => !!(d.airplay && d.airplay.peer);

const BOTH_UP = d => CARLIFE_UP(d.carlife) && CARPLAY_UP(d.carplay);

const CARLIFE_ROWS = [
  ["会话状态", d => bool(CARLIFE_UP(d), "已建立", "未建立"), d => CARLIFE_UP(d) ? "ok" : null],
  ["厂商 / 型号", d => pair(d.asked[0], d.asked[1])],
  ["描述", d => d.asked[2]],
  ["序列号", d => d.asked[5]],
  ["CarLife 协议版本", d => d.protocol ? d.protocol.major + "." + d.protocol.minor : null],
  ["CUID", d => d.statistic && d.statistic.cuid],
  ["渠道号", d => d.statistic && channelLabel(d.statistic.channel)],
  ["分辨率", d => size(d.agreed)],
  ["视频编码", d => video(d.video)],
  ["音频编码", d => d.media
    ? detail(d.media.bits ? "PCM " + d.media.bits + "-bit" : "PCM",
             rate(d.media.rate), channels(d.media.channels))
    : null],
  ["物理尺寸", d => d.physical
    ? d.physical.width_mm + " × " + d.physical.height_mm + " mm"
    : null],
];

const CARLIFE_BLOCKS = [];

const CARPLAY_ROWS = [
  ["会话状态", d => bool(CARPLAY_UP(d), "已建立", "未建立"), d => CARPLAY_UP(d) ? "ok" : null],
  ["接入方式", d => bool(d.wireless, "WiFi", "USB")],
  ["分辨率", d => d.screen ? size(d.screen) : null],
  ["视频编码", d => video(d.video)],
];

const CARPLAY_BLOCKS = [
  ["音频编码", d => d.audio.map(audioStream)],
];

const DEVICE_ROWS = [
  ["CPU 占用率", d => percent(d.cpu_percent)],
  ["内存占用率", d => memory(d)],
  ["固件版本", d => d.firmware],
  ["内核版本", d => d.kernel],
  ["软件版本", d => d.software],
];

const PLAYING_ROWS = [
  ["来源", d => d.source],
  ["歌曲", d => d.song],
  ["艺人 / 歌手", d => d.artist],
  ["专辑", d => d.album],
  ["时长", d => clock(d.duration_s)],
];

const GPS_ROWS = [
  ["定位状态", d => gpsState(d), d => FIXED(d) ? "ok" : null],
  ["经纬度", d => FIXED(d)
    ? degrees(d.latitude) + ", " + degrees(d.longitude)
    : null],
  ["高度", d => FIXED(d) ? metres(d.height / 10) : null],
  ["速度", d => FIXED(d) ? (d.speed / 100).toFixed(2) + " km/h" : null],
  ["航向", d => FIXED(d) ? (d.heading / 10).toFixed(1) + "°" : null],
  ["水平精度", d => FIXED(d) ? metres(d.hor_pos_error) : null],
  ["垂直精度", d => FIXED(d) ? metres(d.vert_pos_error) : null],
  ["时间", d => FIXED(d) ? utc8(d) : null],
];

function cell(label, value, tone, block) {
  const row = document.createElement("div");
  row.className = block ? "weui-cell weui-cell_block" : "weui-cell";

  const bd = document.createElement("div");
  bd.className = "weui-cell__bd";
  const name = document.createElement("p");
  name.textContent = label;
  bd.appendChild(name);

  const ft = document.createElement("div");
  ft.className = "weui-cell__ft";
  if (tone) ft.classList.add("v-" + tone);
  if (value === null || value === "") {
    ft.textContent = NONE;
    ft.classList.add("none");
  } else if (block) {
    for (const line of value) {
      const p = document.createElement("div");
      p.className = "line";
      p.textContent = line;
      ft.appendChild(p);
    }
  } else {
    ft.textContent = value;
  }

  row.appendChild(bd);
  row.appendChild(ft);
  return row;
}

function fill(host, rows, blocks, data, up) {
  host.textContent = "";
  rows.forEach(([label, value, tone], i) => {
    const live = i === 0 || up;
    host.appendChild(cell(label, live ? value(data) : null, live && tone ? tone(data) : null, false));
  });
  for (const [label, lines] of blocks) {
    const value = up ? lines(data) : null;
    host.appendChild(cell(label, value && value.length ? value : null, null, true));
  }
}

let playingKey = "";
let coverShown = null;
let coverImg = null;

function renderPlaying(playing) {
  if (!playing) return;
  const key = [playing.source, playing.song, playing.artist, playing.album,
               playing.duration_s, playing.cover ? playing.cover.id : ""].join("\u0000");
  if (key === playingKey) return;
  playingKey = key;

  const host = document.getElementById("playing");
  host.textContent = "";
  for (const [label, value] of PLAYING_ROWS) {
    host.appendChild(cell(label, value(playing), null, false));
  }
  host.appendChild(coverCell(playing.cover));
}

function coverCell(cover) {
  const row = document.createElement("div");
  row.className = "weui-cell weui-cell_cover";

  const bd = document.createElement("div");
  bd.className = "weui-cell__bd";
  const label = document.createElement("p");
  label.textContent = "封面";
  bd.appendChild(label);

  const ft = document.createElement("div");
  ft.className = "weui-cell__ft";
  if (!cover) {
    ft.textContent = NONE;
    ft.classList.add("none");
  } else {
    if (!coverImg) {
      coverImg = document.createElement("img");
      coverImg.className = "cover";
      coverImg.alt = "封面";
    }
    if (cover.id && coverShown !== cover.id) {
      coverShown = cover.id;
      coverImg.src = "/api/cover?id=" + encodeURIComponent(cover.id);
    }
    ft.appendChild(coverImg);
  }

  row.appendChild(bd);
  row.appendChild(ft);
  return row;
}

function render(data) {
  fill(document.getElementById("carlife"), CARLIFE_ROWS, CARLIFE_BLOCKS, data.carlife, CARLIFE_UP(data.carlife));
  fill(document.getElementById("carplay"), CARPLAY_ROWS, CARPLAY_BLOCKS, data.carplay, CARPLAY_UP(data.carplay));
  fill(document.getElementById("device"), DEVICE_ROWS, [], data.device || {}, true);

  const both = BOTH_UP(data);
  for (const id of ["playing-title", "playing"]) {
    document.getElementById(id).style.display = both ? "" : "none";
  }
  renderPlaying(data.now_playing);

  // The car's position is the car's, and only the car can say it has one: the
  // section appears with the first fix the car reports and goes away when it
  // stops reporting them. A live link with no position in it is not a section.
  const fix = (data.carlife && data.carlife.gps) || null;
  for (const id of ["gps-title", "gps"]) {
    document.getElementById(id).style.display = fix ? "" : "none";
  }
  fill(document.getElementById("gps"), GPS_ROWS, [], fix || {}, true);
}

function now() {
  return new Date().toLocaleTimeString("zh-CN", { hour12: false });
}

const stamp = document.getElementById("stamp");

async function statusTick() {
  try {
    const response = await fetch("/api/status", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    render(await response.json());
    stamp.className = "stamp";
    stamp.textContent = "最后更新 " + now();
  } catch (e) {
    stamp.className = "stamp v-bad";
    stamp.textContent = "读取失败：" + e.message;
  }
}

// ---------------------------------------------------------------- 日志 ----

// The copy of the log on the board, read forward from the byte the last answer
// ended at. It is a file something else is writing to, so it is never fetched
// whole: two seconds of a running bridge is a handful of lines, and asking for
// a megabyte every two seconds is asking the board to hand over its own log
// again and again. What the first answer carries is the whole of the copy, and
// every line of it is kept on screen.
const logBox = document.getElementById("log");
const logStamp = document.getElementById("log-stamp");

let logTail = "";    // 上一次没读完的半行
let logAt = null;    // 已经读到的字节位置，null = 还没读过

const LEVELS = {
  DEBUG: "debug", INFO: "info", WARN: "warn", ERROR: "error",
};

// The order the levels are printed in, quietest first: the selection is the
// lowest one shown, and everything under it is kept but hidden — the lines are
// already on screen, and going back to a lower level is not a reason to read
// them off the copy again.
const RANK = { debug: 0, info: 1, warn: 2, error: 3 };

const levelPick = document.getElementById("log-level");
let floor = RANK[levelPick.value];

// A line is read by its shape, so wrapping is what it does unless it is turned
// off: unwrapped, the whole of a line stays on one row and the box scrolls
// sideways for the rest of it instead of folding it into two.
const wrapPick = document.getElementById("log-wrap");

function applyWrap() {
  logBox.classList.toggle("nowrap", !wrapPick.checked);
}

wrapPick.addEventListener("change", applyWrap);
applyWrap();

// A line is `<stamp> <LEVEL> [area]\t<event> <fields>`, and it is read as the
// three parts the terminal colours: the stamp is looked up, the level is how
// loud it is, and the rest is what was said. A line that does not parse is left
// whole — a line of an unexpected shape is still the line that was written.
function logRow(text) {
  const row = document.createElement("div");
  const found = /^(\d+\.\d+) +(DEBUG|INFO|WARN|ERROR) +([\s\S]*)$/.exec(text);
  if (!found) {
    row.textContent = text;
    return row;
  }
  const name = LEVELS[found[2]];
  row.dataset.level = name;
  row.hidden = RANK[name] < floor;
  const stamp = document.createElement("span");
  stamp.className = "tm";
  stamp.textContent = found[1];
  const level = document.createElement("span");
  level.className = "lv " + LEVELS[found[2]];
  level.textContent = " " + found[2].padStart(5) + " ";
  const rest = document.createElement("span");
  rest.textContent = found[3];
  row.appendChild(stamp);
  row.appendChild(level);
  row.appendChild(rest);
  return row;
}

function atBottom() {
  return logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 24;
}

function appendLog(text) {
  if (!text) return;
  // One answer can end in the middle of a line — a chunk is a number of bytes,
  // not of lines — so the half of it waits for the rest.
  const parts = (logTail + text).split("\n");
  logTail = parts.pop();
  if (!parts.length) return;

  const stick = atBottom();
  const top = logBox.scrollTop;
  for (const line of parts) logBox.appendChild(logRow(line));
  // Reading further back is not undone by a new line arriving: only a view
  // that was already at the end follows it.
  logBox.scrollTop = stick ? logBox.scrollHeight : top;
}

// What is below the level asked for is hidden rather than dropped: switching
// back to a lower one is then a matter of showing lines that are already there.
levelPick.addEventListener("change", () => {
  floor = RANK[levelPick.value];
  for (const row of logBox.children) {
    const at = RANK[row.dataset.level];
    row.hidden = at !== undefined && at < floor;
  }
  // Lines going in and out of view move everything under them, so where the
  // view was is no longer a place worth being: it goes to the newest line.
  logBox.scrollTop = logBox.scrollHeight;
  logStamp.textContent = counted() + " · 最后更新 " + now();
});

// How many of the lines on screen are the level that is being looked for,
// which is the whole of them until a higher one is asked for.
function counted() {
  let seen = 0;
  for (const row of logBox.children) if (!row.hidden) seen++;
  const all = logBox.children.length;
  return seen === all ? seen + " 行" : seen + " / " + all + " 行";
}

async function logTick() {
  try {
    const asked = logAt === null ? "" : "?from=" + logAt;
    const response = await fetch("/api/log" + asked, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    // The copy was rolled over, or the program started again: what is on
    // screen is another run's, or this run's before the roll.
    if (data.reset) {
      logTail = "";
      logBox.textContent = "";
    }
    appendLog(data.text);
    logAt = data.next;
    logStamp.className = "stamp";
    logStamp.textContent = counted() + " · 最后更新 " + now();
  } catch (e) {
    logStamp.className = "stamp v-bad";
    logStamp.textContent = "读取失败：" + e.message;
  }
}

// ---------------------------------------------------------------- tabs ----

let tab = "status";

function select(name) {
  tab = name;
  for (const id of ["status", "log", "settings"]) {
    document.getElementById("panel-" + id).classList.toggle("on", id === name);
    document.getElementById("tab-" + id).classList.toggle("on", id === name);
  }
  // Whatever is not being looked at is not asked for: the board has better
  // things to do with its CPU than answer a hidden tab.
  if (name === "status") statusTick();
  if (name === "log") {
    // A box that was off screen had nowhere to keep its place, so it opens at
    // the end: what the log is looked at for is what is happening now.
    logBox.scrollTop = logBox.scrollHeight;
    logTick();
  }
}

for (const button of document.querySelectorAll(".tabbar .tab")) {
  button.addEventListener("click", () => select(button.dataset.tab));
}

function schedule() {
  if (document.hidden) return;
  if (tab === "status") statusTick();
  if (tab === "log") logTick();
}

// The channel table is asked for before the first status, so the first answer is
// drawn with the make already known instead of being redrawn a poll later.
loadChannels().then(() => {
  select("status");
  setInterval(schedule, 2000);
  document.addEventListener("visibilitychange", schedule);
});
</script>
</body>
</html>
