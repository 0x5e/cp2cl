<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>cp2cl 状态</title>
<link rel="stylesheet" href="/vendor/weui.min.css">
<style>
  html,body{overscroll-behavior-x:none}
  .page{padding:4px 0 calc(28px + env(safe-area-inset-bottom))}
  .weui-cells__title{margin-top:22px}
  .weui-cells__title:first-child{margin-top:14px}
  .weui-cell{padding-top:11px;padding-bottom:11px}
  .weui-cell__bd{flex:0 0 auto;padding-right:16px}
  .weui-cell__ft{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:14px}
  .weui-cell__ft.none{opacity:.35}
  .weui-cell_block{align-items:flex-start}
  .line{padding:2px 0}
  .weui-cell_cover{align-items:flex-start}
  .cover{display:block;max-width:100%;max-height:200px;border-radius:6px;margin:2px 0 0 auto}
  .v-ok{color:#07c160}
  .v-warn{color:#fa9d3b}
  .v-bad{color:#fa5151}
  .stamp{text-align:center;font-size:12px;opacity:.45;padding:18px 16px 0;margin:0}
</style>
</head>
<body>
<div class="page">
  <div class="weui-cells__title">CarLife 连接 · 车机端</div>
  <div class="weui-cells" id="carlife"></div>
  <div class="weui-cells__title">CarPlay 连接 · 手机端</div>
  <div class="weui-cells" id="carplay"></div>
  <div class="weui-cells__title" id="playing-title">正在播放</div>
  <div class="weui-cells" id="playing"></div>
  <div class="weui-cells__title" id="gps-title" style="display: none">车载数据 · GPS</div>
  <div class="weui-cells" id="gps" style="display: none"></div>
  <div class="weui-cells__title">设备端</div>
  <div class="weui-cells" id="device"></div>
  <p class="stamp" id="stamp">正在读取…</p>
</div>
<script>
"use strict";

const NONE = "—";

function bool(v, on, off) {
  return v === null || v === undefined ? null : (v ? on : off);
}
function num(v) {
  return v === null || v === undefined ? null : Number(v).toLocaleString("zh-CN");
}
function size(s) {
  return s ? s.width + " × " + s.height + " @ " + s.fps + " fps" : null;
}
function pair(a, b) {
  return a === null || a === undefined ? null : (b === null || b === undefined ? String(a) : a + " / " + b);
}
function clock(seconds) {
  if (seconds === null || seconds === undefined) return null;
  const total = Math.max(0, Math.round(Number(seconds)));
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}
function percent(v) {
  return v === null || v === undefined ? null : v + "%";
}
function megabytes(bytes) {
  return Math.round(Number(bytes) / 1048576);
}
function memory(d) {
  if (!d.memory_total) return null;
  const used = megabytes(d.memory_used);
  const total = megabytes(d.memory_total);
  const share = Math.round(d.memory_used / d.memory_total * 100);
  return used + "MB / " + total + "MB (" + share + "%)";
}

function detail(...parts) {
  const shown = parts.filter(p => p !== null && p !== undefined && p !== "");
  return shown.length ? shown.join(" ") : null;
}
function video(v) {
  return detail(v.codec, v.profile, v.level && "L" + v.level);
}
function rate(hz) {
  return hz ? Math.round(hz / 10) / 100 + " kHz" : null;
}
function channels(n) {
  if (!n) return null;
  if (n === 1) return "Mono";
  if (n === 2) return "Stereo";
  return n + " ch";
}
function audioStream(a) {
  const body = detail(a.codec, rate(a.rate), channels(a.channels));
  return (a.name || a.stream_type) + ":" + (body ? " " + body : "");
}

// The car's own position. It arrives in the units the CarLife message is
// defined in: a millionth of a degree, a tenth of a metre, a hundredth of a
// kilometre an hour, a tenth of a degree.
const FIXED = d => !!d && d.antenna_state === 1;

function gpsState(d) {
  if (!d || d.antenna_state === undefined) return null;
  if (d.antenna_state === 1) return "已定位";
  if (d.antenna_state === -1) return "无定位";
  return String(d.antenna_state);
}
function degrees(millionths) {
  return (millionths / 1000000).toFixed(6) + "°";
}
function metres(v) {
  return v + " m";
}
// The car counts its fix in UTC; the page shows the clock the people in the car
// read, which is eight hours ahead of it.
function utc8(d) {
  if (!d || !d.year || !d.month || !d.day) return null;
  const pad = (n, width) => String(n).padStart(width, "0");
  const at = Date.UTC(d.year, d.month - 1, d.day, d.hour, d.minute, d.second) +
    8 * 3600 * 1000;
  const t = new Date(at);
  return t.getUTCFullYear() + "-" + pad(t.getUTCMonth() + 1, 2) + "-" +
    pad(t.getUTCDate(), 2) + " " + pad(t.getUTCHours(), 2) + ":" +
    pad(t.getUTCMinutes(), 2) + ":" + pad(t.getUTCSeconds(), 2);
}

const CHANNEL_MAP = {
  "20012100": "DUAL_AUDIO_TRACK",
  "20022100": "HYUNDAI", "20022101": "LFSONATA", "20022102": "CFMISTRA",
  "20022103": "MDAVANTE", "20022104": "LMIX35", "20022105": "GCIX25",
  "20022106": "GRANDSANTEFE",
  "20032100": "KIA", "20032101": "KX5", "20032102": "K3",
  "20041100": "AUDI", "20042100": "AUDI_DUAL_AUDIO",
  "20051100": "SHANGHAIGM",
  "20062100": "DAIMLER",
  "20071100": "PANASONIC",
  "20081100": "VOLKSWAGEN",
  "20092100": "CHANGAN", "20092101": "CS15", "20092102": "V716",
  "20092103": "CS3516", "20092104": "YIDONG16", "20092105": "RUICHENG16",
  "20101100": "HARMAN",
  "20111100": "DELPHI",
  "20122100": "HUAYANG_MTK3360", "20122101": "HUAYANG_MTK8317",
  "20131100": "ALPINE",
  "20141100": "PIONEER",
  "20152100": "ROADROVER_MSTAR786", "20152101": "ROADROVER_QUANZHI",
  "20152102": "ROADROVER_MTK8317", "20152200": "ROADROVER_MSTAR786_2",
  "20162100": "FEIGE_G6", "20162101": "FEIGE_G8", "20162102": "FEIGE_G9",
  "20171100": "WISTEON",
  "20181100": "上汽通用_CADILLAC", "20182100": "CADILLAC_DUAL_AUDIO",
  "20191100": "上汽通用_BUICK", "20192100": "BUICK_DUAL_AUDIO",
  "20201100": "上汽通用_CHEVROLET", "20202100": "CHEVROLET_DUAL_AUDIO",
  "20211100": "BYD",
  "20222101": "YUANFENG", "20222102": "YUANFENG_CSRA", "20222103": "CHEVROLET_K216",
  "20282119": "YIQIFENGTIAN_COROLLA_DA", "20282120": "COROLLA_GSHV",
  "20282126": "IZOA_PANASONIC",
  "20302100": "KAIYUE",
  "20312173": "GELLYAUTO_GEOMETRY",
  "20452100": "GUANGFENG_LEVIN", "20452101": "HIGHLANDER",
  "20452102": "AVN", "20452106": "LEVIN_PHV",
  "20482100": "YUANFENG_ELH_PCBA", "20482101": "YUANFENG_ONLINE",
  "20542100": "YUANFENG_YILI",
  "21070001": "TOYOTA_RAV4",
};

function channelLabel(raw) {
  if (!raw) return null;
  const name = CHANNEL_MAP[raw.trim()];
  return name ? raw + " (" + name + ")" : raw;
}

const CARLIFE_UP = d => d.session_up === true;
const CARPLAY_UP = d => !!(d.airplay && d.airplay.peer);

const BOTH_UP = d => CARLIFE_UP(d.carlife) && CARPLAY_UP(d.carplay);

const CARLIFE_ROWS = [
  ["会话状态", d => bool(CARLIFE_UP(d), "已建立", "未建立"), d => CARLIFE_UP(d) ? "ok" : null],
  ["厂商 / 型号", d => pair(d.asked[0], d.asked[1])],
  ["描述", d => d.asked[2]],
  ["序列号", d => d.asked[5]],
  ["CarLife 协议版本", d => d.protocol ? d.protocol.major + "." + d.protocol.minor : null],
  ["CUID", d => d.statistic && d.statistic.cuid],
  ["渠道号", d => d.statistic && channelLabel(d.statistic.channel)],
  ["分辨率", d => size(d.agreed)],
  ["视频编码", d => video(d.video)],
  ["音频编码", d => d.media
    ? detail(d.media.bits ? "PCM " + d.media.bits + "-bit" : "PCM",
             rate(d.media.rate), channels(d.media.channels))
    : null],
  ["物理尺寸", d => d.physical
    ? d.physical.width_mm + " × " + d.physical.height_mm + " mm"
    : null],
];

const CARLIFE_BLOCKS = [];

const CARPLAY_ROWS = [
  ["会话状态", d => bool(CARPLAY_UP(d), "已建立", "未建立"), d => CARPLAY_UP(d) ? "ok" : null],
  ["接入方式", d => bool(d.wireless, "WiFi", "USB")],
  ["分辨率", d => d.screen ? size(d.screen) : null],
  ["视频编码", d => video(d.video)],
];

const CARPLAY_BLOCKS = [
  ["音频编码", d => d.audio.map(audioStream)],
];

const DEVICE_ROWS = [
  ["CPU 占用率", d => percent(d.cpu_percent)],
  ["内存占用", d => memory(d)],
];

const PLAYING_ROWS = [
  ["来源", d => d.source],
  ["歌曲", d => d.song],
  ["艺人 / 歌手", d => d.artist],
  ["专辑", d => d.album],
  ["时长", d => clock(d.duration_s)],
];

const GPS_ROWS = [
  ["定位状态", d => gpsState(d), d => FIXED(d) ? "ok" : null],
  ["经纬度", d => FIXED(d)
    ? degrees(d.latitude) + ", " + degrees(d.longitude)
    : null],
  ["高度", d => FIXED(d) ? metres(d.height / 10) : null],
  ["速度", d => FIXED(d) ? (d.speed / 100).toFixed(2) + " km/h" : null],
  ["航向", d => FIXED(d) ? (d.heading / 10).toFixed(1) + "°" : null],
  ["水平精度", d => FIXED(d) ? metres(d.hor_pos_error) : null],
  ["垂直精度", d => FIXED(d) ? metres(d.vert_pos_error) : null],
  ["时间", d => FIXED(d) ? utc8(d) : null],
];

function cell(label, value, tone, block) {
  const row = document.createElement("div");
  row.className = block ? "weui-cell weui-cell_block" : "weui-cell";

  const bd = document.createElement("div");
  bd.className = "weui-cell__bd";
  const name = document.createElement("p");
  name.textContent = label;
  bd.appendChild(name);

  const ft = document.createElement("div");
  ft.className = "weui-cell__ft";
  if (tone) ft.classList.add("v-" + tone);
  if (value === null || value === "") {
    ft.textContent = NONE;
    ft.classList.add("none");
  } else if (block) {
    for (const line of value) {
      const p = document.createElement("div");
      p.className = "line";
      p.textContent = line;
      ft.appendChild(p);
    }
  } else {
    ft.textContent = value;
  }

  row.appendChild(bd);
  row.appendChild(ft);
  return row;
}

function fill(host, rows, blocks, data, up) {
  host.textContent = "";
  rows.forEach(([label, value, tone], i) => {
    const live = i === 0 || up;
    host.appendChild(cell(label, live ? value(data) : null, live && tone ? tone(data) : null, false));
  });
  for (const [label, lines] of blocks) {
    const value = up ? lines(data) : null;
    host.appendChild(cell(label, value && value.length ? value : null, null, true));
  }
}

let playingKey = "";
let coverShown = null;
let coverImg = null;

function renderPlaying(playing) {
  if (!playing) return;
  const key = [playing.source, playing.song, playing.artist, playing.album,
               playing.duration_s, playing.cover ? playing.cover.id : ""].join("\u0000");
  if (key === playingKey) return;
  playingKey = key;

  const host = document.getElementById("playing");
  host.textContent = "";
  for (const [label, value] of PLAYING_ROWS) {
    host.appendChild(cell(label, value(playing), null, false));
  }
  host.appendChild(coverCell(playing.cover));
}

function coverCell(cover) {
  const row = document.createElement("div");
  row.className = "weui-cell weui-cell_cover";

  const bd = document.createElement("div");
  bd.className = "weui-cell__bd";
  const label = document.createElement("p");
  label.textContent = "封面";
  bd.appendChild(label);

  const ft = document.createElement("div");
  ft.className = "weui-cell__ft";
  if (!cover) {
    ft.textContent = NONE;
    ft.classList.add("none");
  } else {
    if (!coverImg) {
      coverImg = document.createElement("img");
      coverImg.className = "cover";
      coverImg.alt = "封面";
    }
    if (cover.id && coverShown !== cover.id) {
      coverShown = cover.id;
      coverImg.src = "/api/cover?id=" + encodeURIComponent(cover.id);
    }
    ft.appendChild(coverImg);
  }

  row.appendChild(bd);
  row.appendChild(ft);
  return row;
}

function render(data) {
  fill(document.getElementById("carlife"), CARLIFE_ROWS, CARLIFE_BLOCKS, data.carlife, CARLIFE_UP(data.carlife));
  fill(document.getElementById("carplay"), CARPLAY_ROWS, CARPLAY_BLOCKS, data.carplay, CARPLAY_UP(data.carplay));
  fill(document.getElementById("device"), DEVICE_ROWS, [], data.device || {}, true);

  const both = BOTH_UP(data);
  for (const id of ["playing-title", "playing"]) {
    document.getElementById(id).style.display = both ? "" : "none";
  }
  renderPlaying(data.now_playing);

  // The car's position is the car's, and only the car can say it has one: the
  // section appears with the first fix the car reports and goes away when it
  // stops reporting them. A live link with no position in it is not a section.
  const fix = (data.carlife && data.carlife.gps) || null;
  for (const id of ["gps-title", "gps"]) {
    document.getElementById(id).style.display = fix ? "" : "none";
  }
  fill(document.getElementById("gps"), GPS_ROWS, [], fix || {}, true);
}

const stamp = document.getElementById("stamp");

async function tick() {
  try {
    const response = await fetch("/api/status", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    render(await response.json());
    stamp.className = "stamp";
    stamp.textContent = "最后更新 " +
      new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) {
    stamp.className = "stamp v-bad";
    stamp.textContent = "读取失败：" + e.message;
  }
}

function schedule() {
  if (document.hidden) return;
  tick();
}

tick();
setInterval(schedule, 2000);
document.addEventListener("visibilitychange", schedule);
</script>
</body>
</html>
