# A push builds the program; a tag that names a version builds the images as
# well and publishes the lot as a release. A branch's run keeps nothing — what
# it answers is whether the tree still compiles, and nothing it produces is
# meant to be flashed.
#
# The products carry credentials that are not in the tree: the MFi pair into the
# image's /etc/cp2cl/, the CarLife key into the binary at compile time. They are
# repository secrets and they are read by this workflow only.
name: build

on:
  push:
    branches: [main, develop]
    # `v*.*.*` and nothing looser: the tag is what `build.rs` names the build
    # after, and what the release is titled. A tag that is not a version would
    # publish an image called after it.
    tags: ["v*.*.*"]
  workflow_dispatch:

# A push and the tag on its own commit are two runs, and the tag's is the one
# that is published: a later push cancels its branch's run, never a tag's.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  # For the image the build runs in, which comes from the container registry.
  packages: read

jobs:
  # The program once per architecture: `make app` on its own builds both in
  # turn, and one job each is the same two builds side by side instead.
  #
  # The only job a branch's push has. It needs no MFi pair — the program never
  # reads one, only the image carries it — so nothing but the CarLife key is
  # handed to this job.
  app:
    name: app ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7]
    steps:
      - uses: actions/checkout@v7
        with:
          # `build.rs` reads the tag on the commit and the commit itself, and
          # says `-dirty` when the tree holds anything the commit does not. A
          # shallow clone can answer neither.
          fetch-depth: 0
          submodules: recursive
      - name: Log in to the registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: The image the build runs in
        # Built on a machine, not here: it needs musl.cc, which these runners
        # cannot reach. `make image` is that build, and the image is pushed to
        # the registry once per change of `docker/Dockerfile`.
        #
        # The package has to be readable with this job's `GITHUB_TOKEN`, which
        # reaches only a public package or one granted access to this
        # repository. Neither is true by default for one pushed with a personal
        # token, and the answer is `denied` — not an empty pull.
        run: |
          docker pull ghcr.io/0x5e/cp2cl-builder:latest
          docker tag ghcr.io/0x5e/cp2cl-builder:latest cp2cl-builder
      - name: Build
        env:
          # Read by `make` out of the environment and handed to the compiler by
          # `option_env!`, so it is in the binary and not on the command line.
          CARLIFE_PRIVATE_KEY: ${{ secrets.CARLIFE_PRIVATE_KEY }}
        run: |
          test -n "$CARLIFE_PRIVATE_KEY"
          make app ARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        # Only a tag has anything to publish; a branch's binary was a check
        # that the tree still compiles, and is left where it was built.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: app-${{ matrix.arch }}
          path: dist/app/cp2cl-linux-${{ matrix.arch }}
          if-no-files-found: error
          # Without one, the archive is a directory holding a single file.
          compression-level: 0

  # One image per board, each on its own runner: aarch64 and armv7 are two
  # targets, and the UFI001C is a partition rather than a card, so no two of
  # them are the same image under different names.
  #
  # Only on a tag. Three boards at a couple of hours each is what a release
  # costs, and a branch's push does not ask for one.
  firmware:
    name: firmware ${{ matrix.board }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        board: [nanopi-duo2, orangepi-zero2w, msm8916-ufi001c]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Credentials
        env:
          MFI_IDENTITY_PK8: ${{ secrets.MFI_IDENTITY_PK8 }}
          MFI_CERTIFICATE_P7B: ${{ secrets.MFI_CERTIFICATE_P7B }}
        run: |
          umask 077
          install -d -m 0700 authentication
          printf '%s' "$MFI_IDENTITY_PK8" | base64 -d > authentication/identity.pk8
          printf '%s' "$MFI_CERTIFICATE_P7B" | base64 -d > authentication/certificate.p7b
          test -s authentication/identity.pk8
          test -s authentication/certificate.p7b
      # Buildroot's downloads live in the build volume on a machine, and a runner
      # has no volume to keep anything in. They are carried out of the tree and
      # back into it around the build, which is what lets the cache between runs
      # hold them; the tree itself is thirteen gigabytes and is rebuilt.
      - name: Restore the download cache
        uses: actions/cache@v6
        with:
          path: .buildroot-dl
          # An entry is written once and never rewritten, so the key names the
          # run and the prefix finds the newest one. The prefix does not name a
          # board: the three download nearly the same set of packages.
          key: buildroot-dl-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: |
            buildroot-dl-${{ matrix.board }}-
            buildroot-dl-
      - name: Log in to the registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: The images
        # The program's comes from the registry — see the app job. The buildroot
        # one is built: it fetches from GitHub and apt alone, and it is the
        # makefile's own target, so `make firmware` would build it anyway.
        run: |
          docker pull ghcr.io/0x5e/cp2cl-builder:latest
          docker tag ghcr.io/0x5e/cp2cl-builder:latest cp2cl-builder
          make buildroot-image
      - name: Fill the download cache
        # Handed over to uid 1000, which is the uid the buildroot image creates
        # for the build: a directory root made is one Buildroot cannot write to.
        run: |
          board='${{ matrix.board }}'
          vol="cp2cl-buildroot-out-${board//-/_}"
          mkdir -p .buildroot-dl
          docker volume create "$vol" >/dev/null
          docker run --rm -u 0:0 -v "$vol":/build -v "$PWD/.buildroot-dl":/cache \
            cp2cl-buildroot sh -c 'mkdir -p /build/dl && cp -a /cache/. /build/dl/ \
              && chown 1000:1000 /build/dl'
      - name: Build
        env:
          CARLIFE_PRIVATE_KEY: ${{ secrets.CARLIFE_PRIVATE_KEY }}
        run: |
          test -n "$CARLIFE_PRIVATE_KEY"
          make firmware BOARD=${{ matrix.board }}
      - name: Keep the download cache
        # `always`: a build that stopped halfway downloaded what it got to, and
        # the next run should not fetch it again.
        if: always()
        run: |
          board='${{ matrix.board }}'
          vol="cp2cl-buildroot-out-${board//-/_}"
          docker volume create "$vol" >/dev/null
          docker run --rm -u 0:0 -v "$vol":/build -v "$PWD/.buildroot-dl":/cache \
            -e UID_GID="$(id -u):$(id -g)" cp2cl-buildroot \
            sh -c 'cp -a /build/dl/. /cache/ 2>/dev/null; chown -R "$UID_GID" /cache'
          du -sh .buildroot-dl
      - uses: actions/upload-artifact@v7
        with:
          # The name carries the version, the commit and the board, and is
          # read from the file rather than spelled again here.
          name: firmware-${{ matrix.board }}
          path: dist/firmware/*.img
          if-no-files-found: error
          compression-level: 0

  # The tag's own run publishes what the two builds above produced, and nothing
  # else: every board's image and both binaries, under the names they were
  # built with.
  release:
    name: release ${{ github.ref_name }}
    needs: [app, firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `gh release create --generate-notes` describes the range between
          # this tag and the last one, and it reads that range out of a
          # checkout: without one it fails with "not a git repository", and a
          # shallow one knows neither the tags nor the commits between them.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: files
          # The five artifacts hold files with five different names, so they
          # go into one directory instead of five.
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          # A run re-run over a tag that already has a release replaces its
          # assets rather than failing on the one that exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" files/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
